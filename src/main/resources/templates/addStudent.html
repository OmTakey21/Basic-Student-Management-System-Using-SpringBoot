<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/">Student Management</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}" th:classappend="${currentPage}=='index' ? 'active' : ''">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/registerPage}" th:classappend="${currentPage}=='addStudent' ? 'active' : ''">Add Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/updatePage}" th:classappend="${currentPage}=='updateStudent' ? 'active' : ''">Change Data</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/deletePage}" th:classappend="${currentPage}=='removeStudent' ? 'active' : ''">Delete Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/searchPage}" th:classappend="${currentPage}=='searchStudent' ? 'active' : ''">Search Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/findAll}" th:classappend="${currentPage}=='findAllStudents' ? 'active' : ''">View Students</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Registration Form -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
          <h4>Add New Student</h4>
        </div>
        <div class="card-body">
          <form th:action="@{/reg}" method="post">

            <div class="mb-3">
              <label for="univId" class="form-label">University ID</label>
              <input type="text" class="form-control" id="univId" name="univId" required>
            </div>

            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-Mail ID</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
              <label for="branch" class="form-label">Branch</label>
              <input type="text" class="form-control" id="branch" name="branch" required>
            </div>

            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <input type="text" class="form-control" id="address" name="address" required>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-success">Add Student</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
