<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>View Students</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/">Student Management</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/'/'}" th:classappend="${currentPage}=='index' ? 'active' : ''">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/registerPage}" th:classappend="${currentPage}=='addStudent' ? 'active' : ''">Add Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/updatePage}" th:classappend="${currentPage}=='updateStudent' ? 'active' : ''">Change Data</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/deletePage}" th:classappend="${currentPage}=='removeStudent' ? 'active' : ''">Delete Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/searchPage}" th:classappend="${currentPage}=='searchStudent' ? 'active' : ''">Search Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/findAll}" th:classappend="${currentPage}=='viewStudent' ? 'active' : ''">View Students</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Student Table -->
<div class="container py-5">
  <h2 class="text-center mb-4">Student List</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-primary text-center">
        <tr>
          <th>University ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Branch</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody>
        <!-- If there are students -->
        <tr th:each="student : ${students}">
          <td th:text="${student.univId}" class="text-center"></td>
          <td th:text="${student.name}"></td>
          <td th:text="${student.email}"></td>
          <td th:text="${student.branch}"></td>
          <td th:text="${student.address}"></td>
        </tr>

        <!-- If no students found -->
        <tr th:if="${#lists.isEmpty(students)}">
          <td colspan="5" class="text-center text-muted">No students found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
